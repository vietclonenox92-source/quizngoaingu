<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Multi-Language Master Quiz</title>
    <style>
        :root { --primary: #3498db; --secondary: #e67e22; --dark: #2c3e50; --success: #27ae60; --danger: #c0392b; --bg: #f4f6f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: var(--bg); padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; font-size: 20px; margin-bottom: 15px; color: var(--dark); }
        .select-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .select-row { display: flex; gap: 10px; }
        select { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border: 2px solid #ddd; border-radius: 8px; background: white; color: var(--dark); outline: none; cursor: pointer; }
        .mode-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .mode-btn { flex: 1; min-width: 110px; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #ecf0f1; font-size: 13px; }
        .mode-btn.active { background: var(--primary); color: white; }
        .question-box { background: #fff; border: 1px solid #ddd; padding: 20px; border-radius: 8px; text-align: center; font-size: 17px; font-weight: bold; margin-bottom: 10px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        .result-box { text-align: center; font-style: italic; min-height: 40px; margin-bottom: 15px; font-size: 13px; }
        .choices-grid { display: flex; flex-direction: column; gap: 8px; }
        .choice-btn { width: 100%; padding: 12px; font-size: 15px; background: var(--dark); color: white; border: none; border-radius: 6px; cursor: pointer; }
        .choice-btn.correct { background: var(--success) !important; }
        .choice-btn.wrong { background: var(--danger) !important; }
        .footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .score { font-size: 14px; font-weight: bold; color: var(--success); }
        .next-btn { padding: 8px 16px; background: #e74c3c; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>MULTI-LANGUAGE MASTER</h1>
    <div class="select-group">
        <div class="select-row">
            <select id="lang-select" onchange="updateLevelOptions()">
                <option value="ja">🇯🇵 Tiếng Nhật</option>
                <option value="zh">🇨🇳 Tiếng Trung</option>
                <option value="en">🇺🇸 Tiếng Anh</option>
            </select>
            <select id="level-select" onchange="loadQuizData()"></select>
        </div>
        <div class="mode-container">
            <button class="mode-btn active" id="btn-tuvung" onclick="switchMode('TuVung')">Từ Vựng</button>
            <button class="mode-btn" id="btn-nguphap" onclick="switchMode('NguPhap')">Ngữ Pháp</button>
            <button class="mode-btn" id="btn-hoithoai" onclick="switchMode('HoiThoai')">🗣️ Giao Tiếp</button>
        </div>
    </div>
    <div class="question-box" id="question">Chọn ngôn ngữ & cấp độ...</div>
    <div class="result-box" id="result">Hãy chọn một đáp án!</div>
    <div class="choices-grid">
        <button class="choice-btn" onclick="checkAnswer(0)"></button>
        <button class="choice-btn" onclick="checkAnswer(1)"></button>
        <button class="choice-btn" onclick="checkAnswer(2)"></button>
        <button class="choice-btn" onclick="checkAnswer(3)"></button>
    </div>
    <div class="footer-row">
        <div class="score" id="score">Điểm: 0/0</div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Tiếp theo ➡️</button>
    </div>
</div>

    // =========================================================================
    // ⚙️ LOGIC HỆ THỐNG (Đừng sửa phần này nếu bạn không rành code)
    // =========================================================================
    let currentMode = "TuVung", quizData = [], currentQuestion = null, score = 0, totalQuestions = 0, timer = null;
    window.onload = updateLevelOptions;
    function updateLevelOptions() {
        const lang = document.getElementById("lang-select").value;
        const levelSelect = document.getElementById("level-select");
        levelSelect.innerHTML = "";
        DATA_STORE[lang].levels.forEach(lvl => {
            let opt = document.createElement("option"); opt.value = lvl; opt.innerText = lvl;
            levelSelect.appendChild(opt);
        });
        loadQuizData();
    }
    function loadQuizData() {
        const lang = document.getElementById("lang-select").value;
        const level = document.getElementById("level-select").value;
        const apiKey = level + "_" + currentMode;
        parse(DATA_STORE[lang].data[apiKey] || "");
        score = 0; totalQuestions = 0; document.getElementById("score").innerText = "Điểm: 0/0";
        nextQuestion();
    }
    function switchMode(mode) {
        currentMode = mode;
        document.querySelectorAll(".mode-btn").forEach(btn => btn.classList.remove("active"));
        document.getElementById("btn-" + mode.toLowerCase()).classList.add("active");
        loadQuizData();
    }
    function parse(text) {
        quizData = [];
        text.split("\n").forEach(line => {
            const p = line.split("|").map(x => x.trim());
            if (p.length === 5) quizData.push({q: p[0], a: p[1], c: [p[2], p[3], p[4]]});
        });
    }
    function nextQuestion() {
        clearTimeout(timer); document.getElementById("next-btn").style.display = "none";
        if (quizData.length === 0) { document.getElementById("question").innerText = "Chưa có dữ liệu!"; hideChoices(); return; }
        currentQuestion = quizData[Math.floor(Math.random() * quizData.length)];
        document.getElementById("question").innerText = currentQuestion.q;
        let choices = [...currentQuestion.c, currentQuestion.a].sort(() => Math.random() - 0.5);
        document.querySelectorAll(".choice-btn").forEach((btn, i) => { btn.innerText = choices[i]; btn.disabled = false; btn.style.display = "block"; });
    }
    function hideChoices() { document.querySelectorAll(".choice-btn").forEach(btn => btn.style.display = "none"); }
    function checkAnswer(idx) {
        const btns = document.querySelectorAll(".choice-btn"); const sel = btns[idx].innerText;
        totalQuestions++; btns.forEach(b => b.disabled = true); document.getElementById("next-btn").style.display = "block";
        if (sel === currentQuestion.a) { score++; btns[idx].classList.add("correct"); } 
        else { btns[idx].classList.add("wrong"); btns.forEach(b => { if(b.innerText === currentQuestion.a) b.classList.add("correct"); }); }
        document.getElementById("score").innerText = `Điểm: ${score}/${totalQuestions}`;
        timer = setTimeout(nextQuestion, 3000);
    }
</script>
