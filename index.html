<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Language Level Quiz Online</title>
    <style>
        :root { 
            --primary: #3498db; 
            --secondary: #e67e22; 
            --dark: #2c3e50; 
            --success: #27ae60; 
            --danger: #c0392b; 
            --bg: #f4f6f9; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: var(--bg); padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; font-size: 20px; margin-bottom: 15px; color: var(--dark); }
        
        /* Bộ chọn Ngôn ngữ và Cấp độ */
        .select-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .select-row { display: flex; gap: 10px; }
        select { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border: 2px solid #ddd; border-radius: 8px; background: white; color: var(--dark); outline: none; cursor: pointer; }
        select:focus { border-color: var(--primary); }
        
        /* Khung hạng mục phụ */
        .mode-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #ecf0f1; transition: 0.2s; }
        .mode-btn.active { background: var(--primary); color: white; }
        
        /* Khung câu hỏi và kết quả */
        .question-box { background: #fff; border: 1px solid #ddd; padding: 20px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 10px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        .result-box { text-align: center; font-style: italic; min-height: 40px; margin-bottom: 15px; font-size: 14px; }
        
        /* Nút lựa chọn */
        .choices-grid { display: flex; flex-direction: column; gap: 10px; }
        .choice-btn { width: 100%; padding: 14px; font-size: 16px; background: var(--dark); color: white; border: none; border-radius: 8px; cursor: pointer; }
        .choice-btn.correct { background: var(--success) !important; }
        .choice-btn.wrong { background: var(--danger) !important; }
        
        /* Chân trang */
        .footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .score { font-size: 16px; font-weight: bold; color: var(--success); }
        .next-btn { padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>MULTI-LANGUAGE QUIZ</h1>
    
    <div class="select-group">
        <div class="select-row">
            <select id="lang-select" onchange="updateLevelOptions()">
                <option value="ja">🇯🇵 Tiếng Nhật</option>
                <option value="zh">🇨🇳 Tiếng Trung</option>
                <option value="en">🇺🇸 Tiếng Anh</option>
            </select>
            <select id="level-select" onchange="loadQuizData()">
                </select>
        </div>
        <div class="mode-container">
            <button class="mode-btn active" id="btn-tuvung" onclick="switchMode('TuVung')">Từ Vựng</button>
            <button class="mode-btn" id="btn-nguphap" onclick="switchMode('NguPhap')">Ngữ Pháp</button>
        </div>
    </div>
    
    <div class="question-box" id="question">Đang tải...</div>
    <div class="result-box" id="result">Hãy chọn một đáp án!</div>
    
    <div class="choices-grid">
        <button class="choice-btn" onclick="checkAnswer(0)"></button>
        <button class="choice-btn" onclick="checkAnswer(1)"></button>
        <button class="choice-btn" onclick="checkAnswer(2)"></button>
        <button class="choice-btn" onclick="checkAnswer(3)"></button>
    </div>
    
    <div class="footer-row">
        <div class="score" id="score">Điểm: 0/0</div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Tiếp theo ➡️</button>
    </div>
</div>

<script>
    // =========================================================================
    // 📦 KHO DỮ LIỆU ĐƯỢC PHÂN THEO: NGÔN NGỮ -> LEVEL -> HẠNG MỤC
    // Định dạng: Câu hỏi | Đúng | Sai 1 | Sai 2 | Sai 3
    // =========================================================================
    const DATA_STORE = {
        // 1. TIẾNG NHẬT
        "ja": {
            "levels": ["N5", "N4", "N3"],
            "data": {
                "N5_TuVung": `
                    食べる (taberu) | Ăn | Uống | Ngủ | Đi
                    飲む (nomu) | Uống | Ăn | Chạy | Nói
                `,
                "N5_NguPhap": `
                    ～から (kara) | Vì... | Sau khi... | Nhưng... | Nếu...
                `,
                "N4_TuVung": `
                    教室 (kyoushitsu) | Phòng học | Nhà kho | Công viên | Bệnh viện
                `,
                "N4_NguPhap": `
                    ～ほうがいいです | Nên làm gì... | Không được làm gì... | Có thể làm gì... | Muốn làm gì...
                `,
                "N3_TuVung": `
                    複雑 (fukuzatsu) | Phức tạp | Đơn giản | Tiện lợi | An toàn
                `
            }
        },
        // 2. TIẾNG TRUNG
        "zh": {
            "levels": ["HSK1", "HSK2", "HSK3"],
            "data": {
                "HSK1_TuVung": `
                    吃饭 (chīfàn) | Ăn cơm | Uống nước | Đi ngủ | Học bài
                `,
                "HSK1_NguPhap": `
                    太...了 | Quá... rồi | Rất... | Không... lắm | Hơi...
                `
            }
        },
        // 3. TIẾNG ANH (Đã cập nhật từ Lớp 1 -> Lớp 12)
        "en": {
            "levels": ["Lớp 1", "Lớp 2", "Lớp 3", "Lớp 4", "Lớp 5", "Lớp 6", "Lớp 7", "Lớp 8", "Lớp 9", "Lớp 10", "Lớp 11", "Lớp 12"],
            "data": {
                // ---- LỚP 1 ----
                "Lớp 1_TuVung": `
                    Hello | Xin chào | Cảm ơn | Tạm biệt | Xin lỗi
                    Book | Quyển sách | Cái bút | Thước kẻ | Cục tẩy
                `,
                "Lớp 1_NguPhap": `
                    What is your name? | Tên bạn là gì? | Bạn bao nhiêu tuổi? | Bạn khỏe không? | Bạn đi đâu đấy?
                `,
                
                // ---- LỚP 2 ----
                "Lớp 2_TuVung": `
                    Apple | Quả táo | Quả chuối | Quả cam | Quả xoài
                `,
                "Lớp 2_NguPhap": `
                    How old are you? | Bạn bao nhiêu tuổi? | Tên bạn là gì? | Bạn ở đâu? | Bạn thích cái gì?
                `,

                // ---- LỚP 3 ----
                "Lớp 3_TuVung": `
                    Teacher | Giáo viên | Học sinh | Bác sĩ | Kỹ sư
                `,
                "Lớp 3_NguPhap": `
                    This is a pen | Đây là một cái bút | Kia là một cái bút | Đây là những cái bút | Đó là một cái bút
                `,

                // ---- TỪ LỚP 4 ĐẾN LỚP 12 (Bạn chỉ cần dán từ vựng tương ứng vào bên trong dấu `` bên dưới) ----
                "Lớp 4_TuVung": ``, "Lớp 4_NguPhap": ``,
                "Lớp 5_TuVung": ``, "Lớp 5_NguPhap": ``,
                "Lớp 6_TuVung": ``, "Lớp 6_NguPhap": ``,
                "Lớp 7_TuVung": ``, "Lớp 7_NguPhap": ``,
                "Lớp 8_TuVung": ``, "Lớp 8_NguPhap": ``,
                "Lớp 9_TuVung": ``, "Lớp 9_NguPhap": ``,
                "Lớp 10_TuVung": ``, "Lớp 10_NguPhap": ``,
                "Lớp 11_TuVung": ``, "Lớp 11_NguPhap": ``,
                "Lớp 12_TuVung": ``, "Lớp 12_NguPhap": ``
            }
        }
    };

    // =========================================================================
    // 🛠️ HẾT PHẦN DÁN DỮ LIỆU - LOGIC HỆ THỐNG XỬ LÝ TỰ ĐỘNG
    // =========================================================================

    let currentMode = "TuVung";
    let quizData = [];
    let currentQuestion = null;
    let score = 0, totalQuestions = 0, timer = null;

    window.onload = function() {
        updateLevelOptions();
    };

    function updateLevelOptions() {
        const lang = document.getElementById("lang-select").value;
        const levelSelect = document.getElementById("level-select");
        
        levelSelect.innerHTML = "";
        
        DATA_STORE[lang].levels.forEach(lvl => {
            let opt = document.createElement("option");
            opt.value = lvl;
            // Nếu là tiếng Anh thì hiện "Học Lớp 1", các tiếng khác hiện "Cấp độ N5, HSK1..."
            opt.innerText = (lang === "en") ? "🎒 " + lvl : "⭐ Cấp độ " + lvl;
            levelSelect.appendChild(opt);
        });
        
        loadQuizData();
    }

    function loadQuizData() {
        const lang = document.getElementById("lang-select").value;
        const level = document.getElementById("level-select").value;
        
        const apiKey = level + "_" + currentMode;
        const rawData = DATA_STORE[lang].data[apiKey] || "";
        
        parse(rawData);
        
        score = 0; totalQuestions = 0;
        document.getElementById("score").innerText = "Điểm: 0/0";
        nextQuestion();
    }

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById("btn-tuvung").className = "mode-btn " + (mode === "TuVung" ? "active" : "");
        document.getElementById("btn-nguphap").className = "mode-btn " + (mode === "NguPhap" ? "active" : "");
        loadQuizData();
    }

    function parse(text) {
        quizData = [];
        text.split("\n").forEach(line => {
            const p = line.split("|").map(x => x.trim());
            if (p.length === 5) quizData.push({q: p[0], a: p[1], c: [p[2], p[3], p[4]]});
        });
    }

    function nextQuestion() {
        clearTimeout(timer);
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("result").innerText = "Chọn một đáp án!";
        document.getElementById("result").style.color = "#7f8c8d";
        
        if (quizData.length === 0) { 
            document.getElementById("question").innerText = "Chưa có dữ liệu cho mục này!"; 
            hideChoices();
            return; 
        }
        
        currentQuestion = quizData[Math.floor(Math.random() * quizData.length)];
        document.getElementById("question").innerText = currentQuestion.q;
        
        let choices = [...currentQuestion.c, currentQuestion.a].sort(() => Math.random() - 0.5);
        document.querySelectorAll(".choice-btn").forEach((btn, i) => {
            btn.innerText = choices[i];
            btn.className = "choice-btn";
            btn.disabled = false;
            btn.style.display = "block";
        });
    }

    function hideChoices() {
        document.querySelectorAll(".choice-btn").forEach(btn => btn.style.display = "none");
    }

    function checkAnswer(idx) {
        const btns = document.querySelectorAll(".choice-btn");
        const sel = btns[idx].innerText;
        totalQuestions++;
        btns.forEach(b => b.disabled = true);
        document.getElementById("next-btn").style.display = "block";
        
        if (sel === currentQuestion.a) {
            score++; btns[idx].classList.add("correct");
            res("Chính xác! 🎉", "#27ae60");
        } else {
            btns[idx].classList.add("wrong");
            btns.forEach(b => { if(b.innerText === currentQuestion.a) b.classList.add("correct"); });
            res("Sai rồi! ❌", "#c0392b");
        }
        document.getElementById("score").innerText = `Điểm: ${score}/${totalQuestions}`;
        timer = setTimeout(nextQuestion, 5000);
    }

    function res(t, c) { 
        document.getElementById("result").innerText = t; 
        document.getElementById("result").style.color = c; 
    }
</script>
</body>
</html>
