<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Trắc nghiệm Tiếng Nhật Web</title>
    <style>
        :root {
            --primary: #3498db;
            --secondary: #e67e22;
            --dark: #2c3e50;
            --success: #27ae60;
            --danger: #c0392b;
            --bg: #f4f6f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--dark); padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        .container { max-width: 500px; width: 100%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 10px; }
        h1 { text-align: center; font-size: 22px; margin-bottom: 15px; color: var(--dark); }
        
        /* Chọn hạng mục */
        .mode-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #ecf0f1; transition: 0.2s; }
        .mode-btn.active-tuvung { background: var(--primary); color: white; }
        .mode-btn.active-nguphap { background: var(--secondary); color: white; }
        
        /* Khung câu hỏi */
        .question-box { background: #fff; border: 1px solid #ddd; padding: 20px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 10px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        .result-box { text-align: center; font-style: italic; min-height: 40px; margin-bottom: 15px; font-size: 14px; color: #7f8c8d; }
        
        /* Nút đáp án */
        .choices-grid { display: flex; flex-direction: column; gap: 10px; }
        .choice-btn { width: 100%; padding: 14px; font-size: 16px; background: var(--dark); color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.1s; text-align: center; }
        .choice-btn:disabled { cursor: not-allowed; opacity: 0.8; }
        
        /* Trạng thái đúng sai */
        .choice-btn.correct { background: var(--success) !important; }
        .choice-btn.wrong { background: var(--danger) !important; }
        
        /* Điểm và câu tiếp theo */
        .footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; }
        .score { font-size: 16px; font-weight: bold; color: var(--success); }
        .next-btn { padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; }
        
        /* Khung quản lý dữ liệu dữ phòng */
        .data-management { margin-top: 25px; border-top: 2px dashed #ddd; padding-top: 15px; }
        .data-management summary { font-weight: bold; cursor: pointer; color: #7f8c8d; margin-bottom: 10px; }
        textarea { width: 100%; height: 120px; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-family: monospace; font-size: 12px; margin-bottom: 8px; resize: vertical; }
        .save-btn { padding: 8px 15px; background: #8e44ad; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>JAPANESE QUIZ WEB</h1>
        
        <div class="mode-container">
            <button class="mode-btn active-tuvung" id="btn-tuvung" onclick="switchMode('TuVung')">Từ Vựng</button>
            <button class="mode-btn" id="btn-nguphap" onclick="switchMode('NguPhap')">Ngữ Pháp</button>
        </div>
        
        <div class="question-box" id="question">Đang tải câu hỏi...</div>
        <div class="result-box" id="result">Hãy chọn một đáp án!</div>
        
        <div class="choices-grid">
            <button class="choice-btn" onclick="checkAnswer(0)"></button>
            <button class="choice-btn" onclick="checkAnswer(1)"></button>
            <button class="choice-btn" onclick="checkAnswer(2)"></button>
            <button class="choice-btn" onclick="checkAnswer(3)"></button>
        </div>
        
        <div class="footer-row">
            <div class="score" id="score">Điểm: 0/0</div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Câu tiếp theo ➡️</button>
        </div>

        <div class="data-management">
            <details>
                <summary>⚙️ Chỉnh sửa / Thêm từ vựng mới</summary>
                <p style="font-size: 12px; color: #7f8c8d; margin-bottom: 5px;">Định dạng: Câu hỏi | Đúng | Sai1 | Sai2 | Sai3 (Mỗi câu 1 dòng)</p>
                <textarea id="data-input" placeholder="Nhập dữ liệu vào đây..."></textarea>
                <button class="save-btn" onclick="saveData()">💾 Lưu và Tải lại</button>
            </details>
        </div>
    </div>

    <script>
        // 1. DỮ LIỆU MẶC ĐỊNH (Bạn có thể thêm từ vựng/ngữ pháp trực tiếp tại đây nếu muốn lưu cứng vào code)
        const defaultTuVung = `食べる (taberu) | Ăn | Uống | Ngủ | Đi
飲む (nomu) | Uống | Ăn | Chạy | Nói
先生 (sensei) | Giáo viên | Học sinh | Bác sĩ | Kỹ sư
こんにちは | Xin chào | Cảm ơn | Tạm biệt | Xin lỗi`;

        const defaultNguphap = `～から (kara) | Vì... | Sau khi... | Nhưng... | Nếu...
～ほうがいいです | Nên làm gì... | Không được làm gì... | Muốn làm gì... | Có thể làm gì...`;

        let currentMode = "TuVung";
        let quizData = [];
        let currentQuestion = null;
        let score = 0;
        let totalQuestions = 0;
        let countdownTimer = null;

        // Khởi tạo ứng dụng
        function initApp() {
            if (!localStorage.getItem("web_quiz_TuVung")) localStorage.setItem("web_quiz_TuVung", defaultTuVung);
            if (!localStorage.getItem("web_quiz_NguPhap")) localStorage.setItem("web_quiz_NguPhap", defaultNguphap);
            switchMode(currentMode);
        }

        // Chuyển đổi tab Từ Vựng / Ngữ Pháp
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById("btn-tuvung").className = "mode-btn " + (mode === "TuVung" ? "active-tuvung" : "");
            document.getElementById("btn-nguphap").className = "mode-btn " + (mode === "NguPhap" ? "active-nguphap" : "");
            
            // Đọc dữ liệu từ bộ nhớ trình duyệt (LocalStorage)
            const rawData = localStorage.getItem("web_quiz_" + mode) || "";
            document.getElementById("data-input").value = rawData;
            
            // Reset điểm số
            score = 0; totalQuestions = 0;
            document.getElementById("score").innerText = "Điểm: 0/0";
            
            parseData(rawData);
            nextQuestion();
        }

        // Xử lý dữ liệu text thành mảng câu hỏi
        function parseData(text) {
            quizData = [];
            const lines = text.split("\n");
            for (let line of lines) {
                line = line.trim();
                if (!line || !line.includes("|")) continue;
                const parts = line.split("|").map(p => p.trim());
                if (parts.length === 5) {
                    quizData.push({
                        question: parts[0],
                        correct: parts[1],
                        choices: [parts[2], parts[3], parts[4]]
                    });
                }
            }
        }

        // Lưu dữ liệu khi người dùng sửa trong ô Textarea
        function saveData() {
            const text = document.getElementById("data-input").value;
            localStorage.setItem("web_quiz_" + currentMode, text);
            parseData(text);
            alert("Đã lưu dữ liệu mới thành công!");
            nextQuestion();
        }

        // Qua câu hỏi ngẫu nhiên tiếp theo
        function nextQuestion() {
            clearTimeout(countdownTimer);
            document.getElementById("next-btn").style.display = "none";
            document.getElementById("result").innerText = "Hãy chọn một đáp án!";
            document.getElementById("result").style.color = "#7f8c8d";
            
            if (quizData.length === 0) {
                document.getElementById("question").innerText = "Danh sách trống! Hãy mở phần Chỉnh sửa bên dưới để thêm từ.";
                hideChoices();
                return;
            }

            // Lấy ngẫu nhiên câu hỏi
            currentQuestion = quizData[Math.floor(Math.random() * quizData.length)];
            document.getElementById("question").innerText = "Ý nghĩa của: " + currentQuestion.question;

            // Trộn đáp án
            let allChoices = [...currentQuestion.choices, currentQuestion.correct];
            allChoices.sort(() => Math.random() - 0.5);

            const buttons = document.querySelectorAll(".choice-btn");
            buttons.forEach((btn, idx) => {
                btn.innerText = allChoices[idx];
                btn.className = "choice-btn";
                btn.disabled = false;
                btn.style.display = "block";
            });
        }

        function hideChoices() {
            document.querySelectorAll(".choice-btn").forEach(btn => btn.style.display = "none");
        }

        // Kiểm tra câu trả lời
        function checkAnswer(idx) {
            const buttons = document.querySelectorAll(".choice-btn");
            const selected = buttons[idx].innerText;
            const correct = currentQuestion.correct;
            
            totalQuestions++;
            buttons.forEach(btn => btn.disabled = true);
            document.getElementById("next-btn").style.display = "block";

            if (selected === correct) {
                score++;
                buttons[idx].classList.add("correct");
                startCountdown(5, "Chính xác! 🎉", "#27ae60");
            } else {
                buttons[idx].classList.add("wrong");
                // Tìm và nhuộm xanh nút đúng cho người dùng thấy
                buttons.forEach(btn => { if(btn.innerText === correct) btn.classList.add("correct"); });
                startCountdown(5, `Sai rồi! ❌ Đáp án là: ${correct}`, "#c0392b");
            }
            document.getElementById("score").innerText = `Điểm: ${score}/${totalQuestions}`;
        }

        // Đếm ngược 5 giây tự chuyển câu
        function startCountdown(seconds, statusText, color) {
            const resultBox = document.getElementById("result");
            resultBox.style.color = color;
            if (seconds > 0) {
                resultBox.innerText = `${statusText}\n(Tự động chuyển câu sau ${seconds} giây...)`;
                countdownTimer = setTimeout(() => startCountdown(seconds - 1, statusText, color), 1000);
            } else {
                nextQuestion();
            }
        }

        // Chạy ứng dụng khi load xong trang Web
        window.onload = initApp;
    </script>
</body>
</html>
